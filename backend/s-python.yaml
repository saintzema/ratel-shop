edition: 3.0.0
name: zema360-python
access: aliyun-default

# ─── ZEMA 360 on FC Python 3.10 managed runtime ──────────────────────────────
# No Docker, no ACR needed — code is deployed as a zip from fc_handler/
#
# Deploy:
#   export DASHSCOPE_API_KEY="sk-..."
#   export ALIBABA_CLOUD_ACCESS_KEY_ID="..."
#   export ALIBABA_CLOUD_ACCESS_KEY_SECRET="..."
#   cd backend && s deploy -y --use-local -t s-python.yaml
#
# Health check: GET <endpoint>/api/v1/zema/health
# Negotiate:    POST <endpoint>/api/v1/zema/negotiate

vars:
  region: ap-southeast-1

resources:
  zema360-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: zema360-api
      description: "ZEMA 360 — Qwen-powered autonomous commerce OS for FairPrice.ng"
      runtime: python3.10
      handler: index.handler
      code: ./fc_handler
      timeout: 120
      memorySize: 512
      cpu: 0.5
      diskSize: 512

      triggers:
        - triggerName: http-trigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
              - OPTIONS

      environmentVariables:
        # ── Qwen / Alibaba Cloud Model Studio ──────────────────────────────────
        DASHSCOPE_API_KEY:     ${env.DASHSCOPE_API_KEY}
        QWEN_BASE_URL:         https://dashscope-intl.aliyuncs.com/compatible-mode/v1
        QWEN_MODEL_FAST:       qwen-plus
        QWEN_MODEL_VISION:     qwen-vl-max
        # ── Alibaba Cloud OSS ───────────────────────────────────────────────────
        OSS_BUCKET:            fairprice-zema
        OSS_ENDPOINT:          https://oss-ap-southeast-1.aliyuncs.com
        # ── FairPrice API ──────────────────────────────────────────────────────
        FAIRPRICE_API_URL:     https://fairprice.ng
        ZEMA_SERVICE_TOKEN:    ${env.ZEMA_SERVICE_TOKEN}
        # ── Human-in-the-loop ──────────────────────────────────────────────────
        ZEMA_APPROVER_WHATSAPP: "+2348162816305"
