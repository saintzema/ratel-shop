workflows:
  ios-fairprice:
    name: FairPrice iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # In Codemagic: Teams > your team > Integrations > App Store Connect ->
      # add your API key (Users and Access > Integrations > App Store Connect
      # API in App Store Connect itself, "Admin" access, generates a .p8 you
      # download once). Name the integration exactly this, or change this
      # line to match whatever name you give it.
      app_store_connect: fairprice_asc_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ai.fairprice.app
      vars:
        XCODE_WORKSPACE: "$CM_BUILD_DIR/frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "ai.fairprice.app"
      node: 22.12.0
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CM_BUILD_DIR/frontend"
          npm ci

      # Capacitor's webDir ("out") only ever holds a small static loading/
      # offline-fallback shell — the real app is a WebView pointed at
      # https://www.fairprice.ng (see capacitor.config.ts server.url). It's
      # gitignored as a build artifact, so a fresh CI checkout has nothing
      # there yet; recreate it from the tracked source before syncing.
      - name: Regenerate static shell + sync Capacitor iOS
        script: |
          cd "$CM_BUILD_DIR/frontend"
          mkdir -p out
          cp capacitor-www/index.html out/index.html
          npx cap sync ios

      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      # Apple rejects any upload whose build number isn't strictly higher than
      # every previously uploaded build for this bundle ID, even when the
      # marketing version (1.0.0) is unchanged. A hardcoded CURRENT_PROJECT_VERSION
      # in project.pbxproj hits that wall on every single push after the first
      # successful upload.
      #
      # Tried `app-store-connect get-latest-build-number` + `agvtool new-version`
      # first — agvtool requires VERSIONING_SYSTEM=apple-generic to actually be
      # set on the target, which this project doesn't have, so it silently did
      # nothing and every upload kept colliding with build 1. Patching
      # CURRENT_PROJECT_VERSION directly in project.pbxproj sidesteps agvtool
      # entirely, and a Unix timestamp is always higher than anything before
      # it with zero dependency on querying Apple for the last-used number.
      - name: Bump build number (timestamp-based)
        script: |
          cd "$CM_BUILD_DIR/frontend/ios/App"
          NEW_BUILD_NUMBER=$(date +%s)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW_BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
          echo "Set CURRENT_PROJECT_VERSION to $NEW_BUILD_NUMBER"
          grep "CURRENT_PROJECT_VERSION" App.xcodeproj/project.pbxproj

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - techzema@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Uploads to TestFlight automatically on every successful build off
        # main. Flip to true once you're ready to send builds straight to
        # App Store review instead of just TestFlight.
        submit_to_testflight: true
        submit_to_app_store: false

  android-fairprice:
    name: FairPrice Android (Play Store)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - fairprice_release_keystore
      vars:
        PACKAGE_NAME: "com.fairprice.ng"
      node: 22.12.0
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CM_BUILD_DIR/frontend"
          npm ci

      - name: Regenerate static shell + sync Capacitor Android
        script: |
          cd "$CM_BUILD_DIR/frontend"
          mkdir -p out
          cp capacitor-www/index.html out/index.html
          npx cap sync android

      # android_signing above (Codemagic > Team > Code signing identities >
      # Android keystores) auto-injects CM_KEYSTORE_PATH/PASSWORD/ALIAS env
      # vars and writes them into android/keystore.properties for you —
      # upload frontend/android/keystore/fairprice-release.jks (the one
      # generated locally) there under the name "fairprice_release_keystore",
      # with the store/key password and alias ("fairprice") from
      # frontend/android/keystore.properties (never commit that file).
      - name: Build Android App Bundle
        script: |
          cd "$CM_BUILD_DIR/frontend/android"
          ./gradlew bundleRelease

    artifacts:
      - frontend/android/app/build/outputs/**/*.aab
      - frontend/android/app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - techzema@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
