<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FairPrice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #059669;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFF;
        }
        .logo {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 500;
        }
        .spinner {
            margin-top: 32px;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #FFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .offline-msg {
            position: fixed;
            bottom: 40px;
            font-size: 12px;
            opacity: 0.6;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <div class="logo">FairPrice</div>
    <div class="tagline">Shop Smart, Save More</div>
    <div class="spinner"></div>
    <div class="offline-msg">
        Loading FairPrice... Please check your internet connection.
    </div>
    <script>
        // Auto-redirect to live app when online.
        // This page is only shown as a fallback when the webDir is used —
        // in normal operation, Capacitor loads the live URL from server.url
        // (capacitor.config.ts) directly, this never renders.
        window.addEventListener('load', function() {
            if (navigator.onLine) {
                window.location.href = 'https://www.fairprice.ng';
            }
        });
        window.addEventListener('online', function() {
            window.location.href = 'https://www.fairprice.ng';
        });
    </script>
</body>
</html>
